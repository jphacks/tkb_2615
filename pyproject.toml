[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sheltersim"
version = "0.1.0"
description = "避難所運営条件を検討するためのoffline-first実験用シミュレーター"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.11.9",
    "reportlab>=4.4,<5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-xdist==3.8.0",
    "ruff==0.11.0",
    "pypdf>=5,<6",
    "pypdfium2>=4.30,<5",
]
llm = [
    "anthropic>=1.0,<2",
]
plan-import = [
    "Pillow>=10,<13",
    "pypdfium2>=4.30,<5",
]

[project.scripts]
sheltersim = "sheltersim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sheltersim.contracts" = ["*.json"]
"sheltersim.web" = [
    "fonts/*.ttf", "fonts/OFL.txt",
    "static/*.html", "static/*.js", "static/*.css", "static/*.jpg", "examples/*.json",
    "static/vendor/pdfjs/*.mjs", "static/vendor/pdfjs/LICENSE", "static/vendor/pdfjs/NOTICE.txt",
    "static/vendor/pdfjs/cmaps/*", "static/vendor/pdfjs/standard_fonts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib lets tests/unit, tests/integration and tests/e2e hold files of the same name.
# With -n, worksteal lets idle workers take queued tests, so a few long ones do not
# stretch the run; without -n it has no effect.
addopts = "-ra --import-mode=importlib --dist worksteal"
# tests/ holds the plugins tests/conftest.py loads: results_log.py, which keeps each run's
# results, and the shared fixtures in tests/support/.
pythonpath = ["tests"]
markers = [
    "live_api: paid live API tests in tests/live requiring an explicit dev-environment gate",
    "long_simulation: seven-day simulations and tests taking 30 seconds or more each; run in the long CI lane",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
