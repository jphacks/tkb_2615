# offline CI on Linux, Windows and macOS (#48), on every pull request to main or
# feature/rust-port and by hand. On feature/rust-port it also builds and installs the
# Rust kernels (native/), runs the tests with them, and on Linux once more without them.
name: オフラインCI

on:
  pull_request:
    branches: [main, feature/rust-port]
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same branch or PR replaces an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports, even when another fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      SHELTERSIM_LLM_MODE: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: packageと開発toolを導入
        run: python -m pip install -e ".[dev]"
      - name: Rustのkernelを作って導入
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          python -m pip install "maturin>=1.7,<2"
          maturin build --release -m native/Cargo.toml --out native-dist
          python -m pip install --no-index --find-links native-dist sheltersim-native
          python -c "import sheltersim.native as n; assert n.available(), 'kernels not loaded'"
      - name: 短時間offline test
        run: python -m pytest -m "not long_simulation" -n auto
      - name: Rustのkernelなしで短時間offline test
        if: matrix.os == 'ubuntu-latest'
        env:
          SHELTERSIM_NATIVE: "0"
        run: python -m pytest -m "not long_simulation" -n auto
      - name: test結果を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: .test-results/
          retention-days: 7
          if-no-files-found: ignore
          # .test-results is a dot directory, which upload-artifact skips by default.
          include-hidden-files: true
      - name: lintを確認
        if: matrix.os == 'ubuntu-latest'
        run: ruff check .
      - name: formatを確認
        if: matrix.os == 'ubuntu-latest'
        run: ruff format --check .
