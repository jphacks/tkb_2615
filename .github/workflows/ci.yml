# offline CI on Linux, Windows and macOS (#48). Started by hand for now.
name: オフラインCI

on:
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same branch or PR replaces an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports, even when another fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      SHELTERSIM_LLM_MODE: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Windowsのリアルタイムスキャンを止める
        # The disposable runner scans every file the tests write; the saves of a Run
        # write thousands. This runs only on the CI virtual machine.
        if: runner.os == 'Windows'
        run: Set-MpPreference -DisableRealtimeMonitoring $true
        shell: pwsh
      - name: packageと開発toolを導入
        run: python -m pip install -e ".[dev]"
      - name: 短時間offline test
        run: python -m pytest -m "not long_simulation" -n auto
      - name: test結果を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: .test-results/
          retention-days: 7
          if-no-files-found: ignore
          # .test-results is a dot directory, which upload-artifact skips by default.
          include-hidden-files: true
      - name: lintを確認
        if: matrix.os == 'ubuntu-latest'
        run: ruff check .
      - name: formatを確認
        if: matrix.os == 'ubuntu-latest'
        run: ruff format --check .
