# 手動実行のoffline CI。この整理ではworkflowのtriggerを変更しません。
name: オフラインCI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      SHELTERSIM_LLM_MODE: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: packageと開発toolを導入
        run: python -m pip install -e ".[dev]"
      - name: 短時間offline test
        run: python -m pytest -m "not long_simulation"
      - name: lintを確認
        run: ruff check .
      - name: formatを確認
        run: ruff format --check .
