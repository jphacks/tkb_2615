[package]
name = "sheltersim_native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "sheltersim_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py312"] }
rayon = "1.10"
ryu = "1.0"
sha2 = "0.10"
serde_json = { version = "1.0", features = ["arbitrary_precision"] }

[profile.release]
lto = true
codegen-units = 1
